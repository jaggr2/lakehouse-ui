name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: openapi.yaml + api build + contract tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run check:spec
      - run: npm run build
      - run: npm test
